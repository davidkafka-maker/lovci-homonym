<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lovci homonym</title>
<style>
:root{--bg:#140807;--gold:#ffd36a;--text:#fff7df;--muted:#e8cfaa;--ok:#78f0a0;--bad:#ff6262}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#542014 0,#160806 48%,#050101 100%);color:var(--text)}body.mode-challenge{background:radial-gradient(circle at top,#233f16 0,#160806 52%,#030101 100%)}body.mode-test{background:radial-gradient(circle at top,#5a1717 0,#160806 52%,#030101 100%)}.wrap{max-width:980px;margin:auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}.card{background:linear-gradient(180deg,rgba(61,27,18,.97),rgba(28,10,7,.97));border:1px solid #ffd36a5c;border-radius:22px;box-shadow:0 14px 36px #0008;padding:18px}.title{text-align:center;font-size:clamp(32px,6vw,62px);font-weight:1000;color:var(--gold);text-shadow:0 2px 0 #5d260a,0 0 24px #ffb02e55;margin:10px 0}.subtitle{text-align:center;color:var(--muted);font-size:clamp(15px,2.4vw,20px)}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:14px}.btn{border:0;border-radius:999px;padding:14px 24px;font-weight:1000;font-size:18px;cursor:pointer;box-shadow:0 8px 0 #612507;color:#251006;background:var(--gold)}.challengeBtn{background:linear-gradient(#d0ff9e,#4d9a26);box-shadow:0 8px 0 #1d4a10}.testBtn{background:linear-gradient(#ffb1a9,#c82e2e);box-shadow:0 8px 0 #661111;color:white}.ghost{background:#ffffff12;color:var(--gold);border:1px solid #ffd36a55;box-shadow:none}.input{width:100%;border:2px solid #ffd36a66;border-radius:16px;padding:15px;font-size:22px;background:#fff8e8;color:#1a0804;font-weight:900}.nameBox{max-width:520px;margin:auto;display:flex;flex-direction:column;gap:10px}.topbar{display:grid;grid-template-columns:100px 1fr 100px;align-items:start;gap:10px}.seal{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:1000;border:3px solid #ffce55;box-shadow:inset 0 -18px 28px #0004,0 7px 18px #0008}.challengeSeal{background:linear-gradient(#d0ff9e,#4d9a26);color:#082000}.testSeal{background:linear-gradient(#ffb1a9,#d83333);color:white}.timeCenter{text-align:center;font-size:clamp(46px,7vw,78px);font-weight:1000;line-height:.95}.status{display:block;margin:8px auto 0;padding:7px 10px;border-radius:999px;border:1px solid #ffd36aaa;background:#0005;font-size:clamp(16px,3vw,25px);color:#7cff26}.prompt{text-align:center;color:#ffb0c2;font-size:clamp(19px,3vw,27px);font-weight:1000;margin:12px}.question{border:2px solid #ffbe23dd;border-radius:18px;padding:22px 18px;background:#0004;font-size:clamp(23px,3.7vw,37px);font-weight:850;text-align:center;line-height:1.6}.target-word{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:4px;text-underline-offset:7px}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:12px;margin:16px auto 6px;max-width:700px}.classGrid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:850px}.classGrid .choiceBtn{min-height:84px}.choiceBtn{border:3px solid #ffd36a88;border-radius:16px;padding:13px;background:linear-gradient(#fff8e8,#f5dba7);color:#1a0804;font-size:clamp(17px,2.7vw,24px);font-weight:1000;text-align:center;cursor:pointer;box-shadow:0 6px 0 #8d4d14}.choiceBtn.active{outline:4px solid #fff;transform:translateY(-2px)}.choiceBtn:disabled{opacity:.55;cursor:not-allowed}.feedback{text-align:center;font-size:clamp(19px,3vw,28px);font-weight:1000;min-height:44px;margin:10px}.ok{color:var(--ok)}.bad{color:var(--bad)}.small{font-size:15px;color:var(--muted);text-align:center;line-height:1.5}.result{text-align:center;font-size:22px;line-height:1.55}.foot{text-align:center;color:#e8cfaa88;font-size:12px;margin-top:12px}@media(max-width:700px){.wrap{padding:6px}.card{padding:10px}.topbar{grid-template-columns:68px 1fr 68px;gap:4px}.seal{width:64px;height:64px;font-size:11px}.timeCenter{font-size:42px}.status{font-size:14px;padding:4px}.question{font-size:clamp(21px,6vw,30px);padding:15px 9px}.choiceGrid{gap:9px;margin-top:14px}.classGrid{grid-template-columns:1fr;max-width:480px}.classGrid .choiceBtn{min-height:58px}.choiceBtn{padding:12px}.row .btn{flex:1 1 145px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
"use strict";
const TIME_LIMIT=30,TEST_COUNT=20,CHALLENGE_TARGET=20,app=document.getElementById('app');
// Ke každému výrazu jsou dvě věty. V každé je cílový výraz v přirozeném kontextu.
// Homonyma jsou rozdělena podle shody celé slovní paradigmatu (úplná) nebo jen části tvarů (částečná).
const BANK=[
// 25 homonymních a 25 polysémních výrazů; dvě přirozené věty ke každému.
// Homonymie – úplná
['kolej','H','úplná',"Vlak zpomalil před kolejí a cestující se připravili k výstupu.","Studenti se po vyučování vrátili na kolej a uvařili si večeři.",'studentská kolej'],
['čelo','H','úplná',"Čelo ho po pádu bolelo, a tak si přiložil studený obklad.","V orchestru znělo čelo vedle houslí.",'hudební nástroj čelo'],
['pas','H','úplná',"Krejčová jí změřila pas a upravila sukni.","Cestující předložil pas celníkovi a pokračoval k odletové bráně.",'cestovní pas'],
['stopky','H','úplná',"Rozhodčí spustil stopky, jakmile běžec vyrazil ze startu.","Na třešních zůstaly stopky i po sklizni.",'měřicí stopky'],
['puk','H','úplná',"Puk se odrazil od mantinelu a zastavil před brankářem.","Na jabloni se na jaře objevil první puk.",'pupen nebo záhyb'],
['náprava','H','úplná',"Po nehodě se poškodila náprava auta a mechanik objednal nový díl.","Náprava chyby zabrala víc času, než ředitel čekal.",'odčinění chyby'],
['travička','H','úplná',"Po dešti se na zahradě objevila svěží travička.","Detektiv odhalil travičku, která otrávila obchodníka.",'žena, která tráví jedem'],
['role','H','úplná',"Herečka se na roli připravovala celé léto.","Po orbě zůstala role připravená k setí.",'zemědělská role (pole)'],
['servis','H','úplná',"Jeho servis v prvním setu rozhodl o vítězství.","Vitrína vystavovala porcelánový servis po babičce.",'opravárenská služba'],
// Homonymie – částečná
['los','H','částečná',"Los se vynořil z lesa a zamířil k potoku.","V tombole jsem si koupil los a vyhrál knihu.",'loterijní los'],
['rys','H','částečná',"Rys se tiše vynořil z lesa a pozoroval srnu.","V jeho tváři byl patrný rys po otci.",'vlastnost nebo charakteristický znak'],
['pila','H','částečná',"Pila visela na zdi v dílně vedle pracovního stolu.","Po večeři pila Jana čaj a četla si.",'tvar slovesa pít: ona pila'],
['jez','H','částečná',"Jez zadržoval vodu a chránil pole před záplavou.","Jez pomalu, ať tě po obědě nebolí břicho.",'rozkazovací tvar slovesa jíst'],
['vila','H','částečná',"Vila na kopci měla zelené okenice a prostornou zahradu.","Dívka vila věnec z kopretin pro slavnost.",'tvar slovesa vít: ona vila věnec'],
['září','H','částečná',"V září se děti vracejí do školy a na zahradách dozrávají jablka.","Po nočním dešti září na trávě kapky rosy.",'tvar slovesa zářit: světlo září'],
['hnát','H','částečná',"Hnát v noze ho po pádu bolel, proto lékař doporučil klid.","Pastýř začal hnát ovce k ohradě před setměním.",'sloveso hnát (pohánět)'],
['vinný','H','částečná',"Vinný ocet dodal salátu výraznější chuť.","Vinný řidič se před soudem přiznal k nehodě.",'způsobující nebo nesoucí vinu'],
['klika','H','částečná',"Klika u dveří se zasekla a nešla stlačit.","Měl kliku, že při nehodě nikdo neutrpěl zranění.",'skupina lidí, případně štěstí'],
['rána','H','částečná',"Rána na ruce se po ošetření rychle zahojila.","Každého rána se nad městem zvedla mlha.",'časné ráno'],
['činitel','H','částečná',"Vládní činitel podepsal dohodu a předal ji starostce.","Číslo 6 je činitel součinu 6 × 8.",'matematický faktor nebo působící okolnost'],
['brnění','H','částečná',"Rytířovo brnění ho chránilo při souboji.","Po dlouhém sezení cítil v prstech nepříjemné brnění.",'pocit mravenčení'],
['val','H','částečná',"Val chránil vesnici před vodou z rozvodněné řeky.","„Val míč ke mně!“ zavolal trenér na spoluhráče.",'tvar slovesa valit: vítr valil mraky'],
['zámek','H','úplná',"Zámek u kufru se zasekl a nešel otevřít.","Zámek nad řekou měl novou střechu a opravená okna.",'šlechtické sídlo'],
['vít','H','částečná',"Vít si na výlet sbalil svačinu, láhev a dalekohled.","Vít položil batoh na lavičku a pozdravil spolužáka.",'sloveso vít (plést věnec)'],
['smetla','H','částečná',"Smetla stála v komoře vedle kbelíku a hadru.","Uklízečka smetla drobky z ubrusu do dlaně.",'tvar slovesa smést: ona smetla drobky ze stolu'],
// Polysémie
['běh','P','',"Jeho běh po schodech probudil celý dům.","Běh programu se po aktualizaci zpomalil.",'běh jako pohyb; souvislost s průběhem činnosti'],
['sníh','P','',"Sníh přes noc zasypal zahradu i auta na dvoře.","Děti si ze sněhu postavily pevnost a pak se šly ohřát.",'sníh jako srážka; přenesené označení sněhově bílé hmoty'],
['špička','P','',"Špička boty se zachytila o koberec u dveří.","Špička pelotonu projela cílem jako první.",'hrot předmětu; nejlepší část nebo přední místo'],
['kapitola','P','',"Kapitola o dětství končila návratem do rodného města.","Kapitola jejího života se uzavřela stěhováním do Brna.",'část knihy; etapa nebo období'],
['paprsek','P','',"Ranní paprsek pronikl oknem do pokoje.","V nákresu vedl paprsek od středu kruhu k jeho okraji.",'světelný paprsek; částice vyzařujícího světla'],
['otisk','P','',"V blátě zůstal otisk boty.","Tiskárna zanechala na plakátu rozmazaný otisk.",'stopa po dotyku; kopie nebo reprodukce'],
['plamen','P','',"Plamen svíčky zhasl, když se otevřelo okno.","V jeho řeči znovu vzplál plamen nadšení.",'oheň; obrazně nadšení či vášeň'],
['vlak','P','',"Vlak zastavil na nádraží a cestující vystoupili.","Po vyrušení se mu přerušil vlak myšlenek.",'souprava; sled nebo proud událostí'],
['klíč','P','',"Klíč od sklepa visel na háčku vedle zvonku.","Klíčem k úspěchu byla trpělivost.",'nástroj k odemykání; řešení nebo hudební označení'],
['hlava','P','',"Po úrazu ho bolela hlava a lékař mu doporučil klid.","Nová hlava oddělení přivítala zaměstnance.",'část těla; vedoucí osoba nebo horní část'],
['oko','P','',"Po dlouhém čtení oko pálilo a začalo slzet.","Oko jehly bylo příliš malé na silnou nit.",'zrakový orgán; otvor či smyčka'],
['jazyk','P','',"Jazyk ho po horké polévce pálil.","Cizí jazyk se učila kvůli práci.",'orgán; systém dorozumívání'],
['kořen','P','',"Kořen stromu nadzvedl dlaždici u zdi.","Kořen slova najdeme v jeho základní části.",'část rostliny; základ slova nebo matematický základ'],
['rameno','P','',"Po plavání ho bolelo pravé rameno.","Řeka má u města krátké rameno, které se vrací do hlavního toku.",'část těla; boční větev či výběžek'],
['noha','P','',"Noha ho po námaze bolela, a tak si sedl na lavičku.","Židle měla jednu nohu kratší než ostatní.",'končetina; podpěrná část nábytku'],
['koruna','P','',"Koruna dubu sahala až nad střechu domu.","Koruna po válce ztratila část své hodnoty.",'část stromu; královská ozdoba nebo měna'],
['list','P','',"List javora přistál na trávě.","Otočila list a pokračovala ve čtení.",'část rostliny; stránka papíru'],
['zub','P','',"Zuby si po večeři pečlivě vyčistil a kartáček vrátil do kelímku.","Jeden zub ozubeného převodu se ulomil.",'část chrupu; výstupek na nástroji nebo kole'],
['křídlo','P','',"Pták si poranil křídlo a veterinář ho ošetřil.","Východní křídlo budovy se opravovalo celé léto.",'část těla; boční část budovy či stroje'],
['větev','P','',"Větev spadla na trávník během noční bouřky.","Větev matematiky se zabývá vztahy mezi čísly.",'část stromu; odvětví nebo rodová linie'],
['síť','P','',"Tenisový míček uvízl v síti a rozhodčí přerušil zápas.","Počítač se připojil k síti až po restartu.",'propletená tkanina; propojený systém'],
['most','P','',"Kamenný most přes řeku poškodil silný proud.","Zubař nasadil pacientovi nový most.",'stavba; spojovací část či prostředek'],
['pata','P','',"Po túře ho bolela pata a musel si zout botu.","Na patě svahu stála malá chata.",'část nohy; spodní nebo zadní část předmětu'],
['srdce','P','',"Srdce mu po námaze bušilo rychleji než obvykle.","Praha je srdcem Čech.",'orgán; střed nebo citové jádro'],
['ruka','P','',"Ruka ho po práci bolela a zápěstí měl oteklé.","Podal mu pomocnou ruku, když ji nejvíc potřeboval.",'část těla; pomoc či pracovní síla'],
];
const TARGET_SURFACES={'kolej':['kolejí','kolej'],'klika':['Klika','kliku'],'travička':['travička','travičku'],'role':['roli','role'],'kapitola':['Kapitola','Kapitola'],'zub':['zuby','zub'],'síť':['síti','síti'],'pata':['pata','patě'],'srdce':['Srdce','srdcem'],'ruka':['Ruka','ruku'],'klíč':['Klíč','Klíčem']};
const DATA=BANK.flatMap((r,i)=>r.slice(3,5).map((sentence,j)=>({id:i*2+j+1,target:r[0],targetWord:(TARGET_SURFACES[r[0]]||[r[0],r[0]])[j],kind:r[1],subtype:r[2],sentence,other:r[5],lemmaIndex:i})));
const state={screen:'home',mode:'',index:0,score:0,correct:0,wrong:0,streak:0,selectedWord:'',selectedKind:'',selectedSubtype:'',locked:false,pool:[],timer:null,pending:null};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(s){app.innerHTML=s;document.body.className=state.mode?'mode-'+state.mode:''}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function home(){clearInterval(state.timer);clearTimeout(state.pending);state.screen='home';state.mode='';render(`<div class="card"><h1 class="title">Lovci homonym</h1><p class="subtitle">Rozliš homonymii a polysémii. U homonym navíc urči, zda jsou úplná, nebo částečná.</p><div class="row"><button class="btn testBtn" data-mode="test">TEST</button><button class="btn challengeBtn" data-mode="challenge">VÝZVA</button><button class="btn" data-mode="practice">TRÉNINK</button></div><p class="small">V každé větě je podtržený výraz. Urči, zda jde o úplnou homonymii, částečnou homonymii, nebo polysémii.</p></div>`);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>login(b.dataset.mode))}
function login(mode){state.mode=mode;state.screen='login';render(`<div class="card"><h1 class="title">${mode==='test'?'TEST':mode==='challenge'?'VÝZVA':'TRÉNINK'}</h1><p class="subtitle">Vyplň příjmení a třídu.</p><form class="nameBox" id="login"><label for="surname">Příjmení</label><input class="input" id="surname" required autocomplete="off"><label for="className">Třída</label><input class="input" id="className" required autocomplete="off"><div class="row"><button class="btn" type="submit">ZAČÍT</button><button class="btn ghost" type="button" id="back">ZPĚT</button></div></form></div>`);document.getElementById('back').onclick=home;document.getElementById('login').onsubmit=e=>{e.preventDefault();state.name=document.getElementById('surname').value.trim();state.clazz=document.getElementById('className').value.trim();start()}}
function testPool(){const groups=[...new Set(DATA.map(q=>q.target))].map(target=>DATA.filter(q=>q.target===target));const pick=(kind,subtype,count)=>shuffle(groups.filter(g=>g[0].kind===kind&&(!subtype||g[0].subtype===subtype))).slice(0,count).map(g=>shuffle(g)[0]);return shuffle([...pick('H','úplná',5),...pick('H','částečná',5),...pick('P','',10)])}
function start(){clearInterval(state.timer);state.screen='question';state.index=0;state.score=0;state.correct=0;state.wrong=0;state.streak=0;state.pool=state.mode==='test'?testPool():shuffle(DATA);next()}
function next(){clearInterval(state.timer);clearTimeout(state.pending);if(state.mode==='test'&&state.index>=TEST_COUNT)return finish();if(state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET)return finish();if(state.mode==='practice'&&state.index>=state.pool.length){state.pool=shuffle(DATA);state.index=0}state.current=state.pool[state.index];state.selectedWord='';state.selectedKind='';state.selectedSubtype='';state.locked=false;renderQuestion();if(state.mode!=='practice')startTimer()}
function sentenceHtml(q){let marked=false;const target=(q.targetWord||q.target).normalize('NFC').toLocaleLowerCase('cs');return q.sentence.replace(/[\p{L}\p{M}]+(?:['’][\p{L}\p{M}]+)*(?:-[\p{L}\p{M}]+)*/gu,w=>{if(!marked&&w.normalize('NFC').toLocaleLowerCase('cs')===target){marked=true;return `<u class="target-word">${esc(w)}</u>`}return esc(w)})}
function renderQuestion(){const q=state.current;const time=state.mode==='practice'?'∞':TIME_LIMIT;render(`<div class="card"><div class="topbar"><div class="seal ${state.mode==='challenge'?'challengeSeal':'testSeal'}">${state.mode==='challenge'?'VÝZVA':state.mode==='practice'?'TRÉNINK':'TEST'}</div><div class="timeCenter"><span id="time">${time}</span><span class="status">${state.mode==='test'?'ÚLOHA '+(state.index+1)+'/'+TEST_COUNT+' • BODY '+state.score:state.mode==='challenge'?'SÉRIE '+state.streak+'/'+CHALLENGE_TARGET:'OTÁZKA '+(state.index+1)}</span></div><div class="seal">${q.kind==='H'?'H / P':'H / P'}</div></div><div class="prompt">Urči podtržený výraz výběrem jedné ze tří možností.</div><div class="question">${sentenceHtml(q)}</div><div class="choiceGrid classGrid"><button class="choiceBtn" data-class="HU">HOMONYMIE<br>ÚPLNÁ</button><button class="choiceBtn" data-class="HC">HOMONYMIE<br>ČÁSTEČNÁ</button><button class="choiceBtn" data-class="P">POLYSÉMIE</button></div><div class="feedback" id="fb" aria-live="polite"></div><div id="nextRow" class="row"></div>${state.mode!=='test'?'<div class="row"><button class="btn ghost" id="menu">MENU</button></div>':''}</div>`);document.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{if(state.locked||b.disabled)return;state.selectedKind=b.dataset.class;document.querySelectorAll('[data-class]').forEach(x=>x.classList.toggle('active',x===b));submit()});document.getElementById('menu')?.addEventListener('click',home)}

function expectedClass(q){return q.kind==='P'?'P':q.subtype==='úplná'?'HU':'HC'}function classLabel(q){return q.kind==='P'?'polysémie':'homonymie '+q.subtype}
function submit(){if(state.locked)return;if(!state.selectedKind)return;state.locked=true;clearInterval(state.timer);const q=state.current;const correct=state.selectedKind===expectedClass(q);if(correct){state.score++;state.correct++;state.streak++;soundCorrect();document.getElementById('fb').innerHTML='<span class="ok">SPRÁVNĚ</span>'}else{state.wrong++;state.streak=0;soundWrong();document.getElementById('fb').innerHTML='<span class="bad">ZKUS TO PŘÍŠTĚ</span><br><span class="small">Správně: <b>'+esc(q.targetWord||q.target)+'</b> — '+esc(classLabel(q))+'. Další význam: '+esc(q.other)+'.</span>'}document.querySelectorAll('[data-class]').forEach(e=>{e.style.pointerEvents='none';e.disabled=true});if(state.mode==='practice'){document.getElementById('nextRow').innerHTML='<button class="btn ghost" id="next">DALŠÍ</button>';document.getElementById('next').onclick=advance;return}if(state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET){state.pending=setTimeout(finish,900);return}document.getElementById('nextRow').innerHTML='<button class="btn ghost" id="next">DALŠÍ</button>';document.getElementById('next').onclick=advance;state.pending=setTimeout(advance,correct?900:6000)}
function advance(){clearTimeout(state.pending);state.index++;next()}function startTimer(){state.deadline=Date.now()+TIME_LIMIT*1000;tick();state.timer=setInterval(tick,200)}function tick(){const el=document.getElementById('time');if(!el)return;const rem=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));el.textContent=rem;if(rem===0&&!state.locked){state.locked=true;state.wrong++;state.streak=0;soundWrong();document.getElementById('fb').innerHTML='<span class="bad">ČAS VYPRŠEL</span><br><span class="small">Správně: <b>'+esc(state.current.targetWord||state.current.target)+'</b> — '+esc(classLabel(state.current))+'. Další význam: '+esc(state.current.other)+'.</span>';document.getElementById('nextRow').innerHTML='<button class="btn ghost" id="next">DALŠÍ</button>';document.getElementById('next').onclick=advance;state.pending=setTimeout(advance,6000)}}let audioContext=null;function soundTone(freq,duration,delay=0,type='sine'){if(!audioContext)return;const start=audioContext.currentTime+delay,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.12,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(audioContext.destination);o.start(start);o.stop(start+duration+.02)}function soundReady(callback){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;if(!audioContext||audioContext.state==='closed')audioContext=new A();if(audioContext.state==='running')callback();else audioContext.resume().then(()=>{if(audioContext.state==='running')callback()}).catch(()=>{})}catch(e){}}function soundCorrect(){soundReady(()=>{soundTone(660,.12);soundTone(880,.16,.12)})}function soundWrong(){soundReady(()=>{soundTone(220,.22,0,'triangle');soundTone(165,.28,.12,'triangle')})}
function grade(s){return s>=18?1:s>=16?2:s>=14?3:s>=12?4:5}
function finish(){clearInterval(state.timer);clearTimeout(state.pending);state.screen='finish';const g=state.mode==='challenge'?(state.streak>=CHALLENGE_TARGET?1:grade(state.score)):grade(state.score);render(`<div class="card"><h1 class="title">${state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET?'VÝZVA SPLNĚNA':'VÝSLEDEK'}</h1><div class="result"><b>${esc(state.name)} • ${esc(state.clazz)}</b><br>Správně: <b>${state.score}</b>${state.mode==='test'?' / 20':''}<br>Známka: <b>${g}</b>${state.mode==='challenge'&&state.streak>=CHALLENGE_TARGET?'<br>20 správných odpovědí za sebou':''}</div><div class="row"><button class="btn" onclick="home()">HLAVNÍ MENU</button></div></div>`)}
// Keep browser-back from silently returning to an unfinished assessment.
window.addEventListener('pagehide',()=>{if(state.screen==='question'&&state.mode==='test'){try{sessionStorage.setItem('lovciHomonymPodvod','1')}catch(e){}}});if(sessionStorage.getItem('lovciHomonymPodvod')){sessionStorage.removeItem('lovciHomonymPodvod');state.screen='finish';render('<div class="card"><h1 class="title">PODVOD</h1><p class="result">Test byl ukončen po opuštění stránky.</p><div class="row"><button class="btn" onclick="home()">HLAVNÍ MENU</button></div></div>')}else home();
</script></body></html>
